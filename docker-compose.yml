# =============================================================================
#  Azeroth family server -- Dokploy stack
# =============================================================================
#  Deploy this as a Dokploy "Docker Compose" application.
#  Nothing here compiles anything; build-and-push.sh already produced the images.
#
#  First deploy takes ~20 min: ac-client-data-init downloads ~16 GB of maps and
#  ac-db-import builds the databases. Both only run once.
# =============================================================================

services:

  # ---------------------------------------------------------------- database
  ac-database:
    image: mysql:8.4
    container_name: ac-database
    restart: unless-stopped
    networks: [ac-network]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in Dokploy}
    # Default MySQL settings are not adequate for playerbots and cause constant
    # disk thrashing. These are the tuning values the module documents.
    command: >
      --skip-log-bin
      --innodb-buffer-pool-size=${DB_BUFFER_POOL:-2G}
      --innodb-io-capacity=500
      --innodb-io-capacity-max=2500
      --transaction-isolation=READ-COMMITTED
    volumes:
      - ac-database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute 'SHOW DATABASES;'"]
      interval: 5s
      timeout: 10s
      retries: 40

  # ------------------------------------------------- client data (runs once)
  # Downloads the prebuilt maps/vmaps/mmaps/dbc into a volume. This is the
  # official AzerothCore data image -- the map data is not fork-specific, and
  # it ships enUS dbc files, which is exactly what playerbots requires.
  ac-client-data-init:
    image: acore/ac-wotlk-client-data:${CLIENT_DATA_TAG:-master}
    container_name: ac-client-data-init
    networks: [ac-network]
    volumes:
      - ac-client-data:/azerothcore/env/dist/data

  # --------------------------------------------- module SQL (runs each boot)
  # mod-playerbots owns its own database, and the *worldserver* is the only
  # process that can build it: dbimport registers Login/Character/World and
  # nothing else (src/tools/dbimport/Main.cpp:116-118), while acore_playerbots
  # is added by the module's own DatabaseScript, which is compiled into the
  # worldserver binary. The AC_PLAYERBOTS_DATABASE_INFO handed to ac-db-import
  # below is therefore inert -- keep it, but do not expect it to import anything.
  #
  # The catch is that the core's Dockerfile COPYs modules/ into the db-import
  # stage only (apps/docker/Dockerfile:208); the worldserver stage takes just
  # the binary (:174-191). So the worldserver ships an *empty*
  # /azerothcore/modules and first boot dies with
  #   Directory ".../mod-playerbots/data/sql/playerbots/base/" not exist
  # followed by "Could not populate the Playerbots database" and SIGSEGV.
  #
  # Stage the tree out of the db-import image, which does have it. This runs on
  # every boot and overwrites rather than relying on Docker's populate-an-empty-
  # volume behaviour, which would silently keep serving last month's module SQL
  # after a core update.
  ac-module-sql-init:
    image: ${IMAGE_PREFIX:-azeroth-family}/db-import:${IMAGE_TAG:-latest}
    container_name: ac-module-sql-init
    networks: [ac-network]
    # cp -a as root preserves the acore:acore ownership the worldserver reads as.
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp -a /azerothcore/modules/. /staged/ && echo 'staged module SQL:' && ls /staged"]
    volumes:
      - ac-modules:/staged

  # -------------------------------------------------- db import (runs once)
  ac-db-import:
    image: ${IMAGE_PREFIX:-azeroth-family}/db-import:${IMAGE_TAG:-latest}
    container_name: ac-db-import
    networks: [ac-network]
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_characters"
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_playerbots"
    volumes:
      - ac-etc:/azerothcore/env/dist/etc
      - ac-logs:/azerothcore/env/dist/logs
    depends_on:
      ac-database:
        condition: service_healthy

  # ------------------------------------------- realm address (runs each boot)
  # Two jobs, both of which are otherwise silent footguns:
  #  1. create acore_playerbots, which the normal importer does not always make
  #  2. point the realm at an address your family's clients can actually reach
  #     -- the default is 127.0.0.1, which means "connects fine, then hangs at
  #     the character screen forever". This is THE classic private-server bug.
  ac-realm-config:
    image: mysql:8.4
    container_name: ac-realm-config
    networks: [ac-network]
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      REALM_NAME: ${REALM_NAME:-Azeroth Familiar}
      REALM_ADDRESS: ${REALM_ADDRESS:?set REALM_ADDRESS to your Tailscale IP}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        mysql -h ac-database -u root -e "CREATE DATABASE IF NOT EXISTS acore_playerbots;"
        mysql -h ac-database -u root acore_auth -e "
          UPDATE realmlist
             SET name         = '$${REALM_NAME}',
                 address      = '$${REALM_ADDRESS}',
                 localAddress = '$${REALM_ADDRESS}',
                 port         = 8085,
                 flag         = 0,
                 gamebuild    = 12340
           WHERE id = 1;"
        echo "realm 1 -> $${REALM_ADDRESS}:8085"
        mysql -h ac-database -u root acore_auth -e "SELECT id, name, address, port FROM realmlist;"
    depends_on:
      ac-db-import:
        condition: service_completed_successfully

  # --------------------------------------------------------------- authserver
  # Handles login only. Small and quiet. Port 3724 is what the client's
  # realmlist.wtf points at.
  ac-authserver:
    image: ${IMAGE_PREFIX:-azeroth-family}/authserver:${IMAGE_TAG:-latest}
    container_name: ac-authserver
    restart: unless-stopped
    tty: true
    networks: [ac-network]
    environment:
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_TEMP_DIR: "/azerothcore/env/dist/temp"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_auth"
    ports:
      # BIND_ADDR=100.x.y.z pins this to the Tailscale interface only, so the
      # server is unreachable from your LAN and from the internet. That is the
      # whole "closed realm" guarantee, enforced at the socket rather than by
      # a setting someone can flip.
      - "${BIND_ADDR:-0.0.0.0}:${AUTH_PORT:-3724}:3724"
    volumes:
      - ac-etc:/azerothcore/env/dist/etc
      - ac-logs:/azerothcore/env/dist/logs
    depends_on:
      ac-database:
        condition: service_healthy
      ac-realm-config:
        condition: service_completed_successfully

  # -------------------------------------------------------------- worldserver
  ac-worldserver:
    image: ${IMAGE_PREFIX:-azeroth-family}/worldserver:${IMAGE_TAG:-latest}
    container_name: ac-worldserver
    restart: unless-stopped
    # Needed so you can `docker attach ac-worldserver` and use the GM console
    # to create accounts. Detach again with Ctrl-P Ctrl-Q (NOT Ctrl-C, that
    # stops the server).
    stdin_open: true
    tty: true
    networks: [ac-network]
    env_file:
      # All the family/kid settings live here. Generated from family-settings.ini
      # by scripts/ini2env.py -- never hand-edit.
      - ./family.env
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_characters"
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_playerbots"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${WORLD_PORT:-8085}:8085"
    volumes:
      - ac-etc:/azerothcore/env/dist/etc
      - ac-logs:/azerothcore/env/dist/logs
      - ac-client-data:/azerothcore/env/dist/data:ro
      # Staged by ac-module-sql-init. Without this the worldserver cannot create
      # acore_playerbots -- see the comment on that service.
      - ac-modules:/azerothcore/modules:ro
      # The C++ half of mod-llm-chatter reads ~100 keys from here. Anything not
      # listed in the file falls back to the compiled-in default, which is why
      # we can ship deltas only. No API key is in this file.
      - ./llm-chatter-settings.conf:/azerothcore/env/dist/etc/modules/mod_llm_chatter.conf:ro
    depends_on:
      ac-database:
        condition: service_healthy
      ac-realm-config:
        condition: service_completed_successfully
      ac-client-data-init:
        condition: service_completed_successfully
      ac-module-sql-init:
        condition: service_completed_successfully

  # ------------------------------------------------------- llm chatter bridge
  # The Python half of mod-llm-chatter. It is deliberately NOT in the game
  # process: the worldserver drops event rows into acore_characters and moves
  # on, the bridge polls them, calls the API, and writes replies back for
  # delivery on the next world tick. No API call ever blocks the server.
  #
  # Provider is set in llm-chatter-settings.conf, not here -- currently
  # OpenRouter -> deepseek/deepseek-v4-flash. Switching back to Anthropic, or
  # on to a local Ollama box, is that file plus a restart of this one
  # container; the images do not change.
  ac-llm-chatter-bridge:
    image: ${IMAGE_PREFIX:-azeroth-family}/llm-chatter-bridge:${IMAGE_TAG:-latest}
    container_name: ac-llm-chatter-bridge
    restart: unless-stopped
    networks: [ac-network]
    environment:
      # Assembled into the config at container start. Never written to git.
      # Both are optional HERE on purpose: the image's entrypoint injects only
      # the key matching LLMChatter.Provider and fails loudly if that one is
      # missing. A `:?` on either would instead break `docker compose config`
      # and every deploy for anyone not using that provider. Set both in
      # Dokploy and switching providers needs no new secret.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./llm-chatter-settings.conf:/config/llm-chatter-settings.conf:ro
      # The audit log lands here: /logs/llm_requests.jsonl. Read it.
      - ac-logs:/logs
    depends_on:
      ac-database:
        condition: service_healthy
      # The bridge does NOT create its own tables -- it expects the module's
      # character schema to exist already. db-import applies it from
      # modules/mod-llm-chatter/data/sql/characters/base/. Starting the bridge
      # against a fresh database before that runs is the documented failure.
      ac-db-import:
        condition: service_completed_successfully

  # ------------------------------------------------------------------ admin ui
  # The web console: accounts, GM levels, graceful restart, backups, and a
  # read-only page the family can use to see who is online.
  #
  # It has NO Docker socket, deliberately. Everything it does goes through MySQL
  # or through SOAP on ac-worldserver:7878, which is reachable on ac-network and
  # published nowhere. docker.sock in a web-facing container is host root; the
  # one feature that would justify any Docker access (a container health grid)
  # is not in v1.
  #
  # Published on BIND_ADDR, so this page is tailnet-only by exactly the same
  # mechanism that already contains 3724 and 8085.
  ac-admin-ui:
    image: ${IMAGE_PREFIX:-azeroth-family}/admin-ui:${IMAGE_TAG:-latest}
    container_name: ac-admin-ui
    restart: unless-stopped
    networks: [ac-network]
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # A dedicated gmlevel-3 service account, created once with
      # ./scripts/admin.sh. NOT a family member's login -- passing a user's
      # password through would mean holding it in the session.
      SOAP_USER: ${SOAP_USER:?set SOAP_USER in Dokploy}
      SOAP_PASS: ${SOAP_PASS:?set SOAP_PASS in Dokploy}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${UI_PORT:-8080}:8080"
    volumes:
      - ac-backups:/backups
    depends_on:
      ac-database:
        condition: service_healthy

volumes:
  ac-database:
  ac-client-data:
  ac-etc:
  ac-logs:
  ac-modules:
  ac-backups:

networks:
  ac-network:
