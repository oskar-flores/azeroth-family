# =============================================================================
#  mod-llm-chatter -- family server overrides
# =============================================================================
#  This file holds ONLY our deltas. The module's full conf.dist is baked into
#  the bridge image and this file is layered on top of it, so anything not
#  mentioned here keeps the upstream default and new upstream keys arrive on
#  the next build without needing a merge.
#
#  Two consumers read it:
#    - ac-llm-chatter-bridge  (Python, makes the API calls)
#    - ac-worldserver         (C++ side, mounted as etc/modules/mod_llm_chatter.conf)
#
#  NO SECRETS HERE. This file is committed to a public repo. The database
#  password and the API key for whichever provider is selected below are
#  appended at container start from Dokploy's environment -- see
#  docker/llm-chatter-bridge.Dockerfile. Config is parsed last-wins, so the
#  appended lines override anything above.
#
#  Keys marked [BRIDGE] in the upstream conf.dist only take effect after
#  restarting ac-llm-chatter-bridge, not the worldserver.
# =============================================================================


# -----------------------------------------------------------------------------
#  PROVIDER -- OpenRouter -> DeepSeek V4 Flash. Eventually: local Ollama.
# -----------------------------------------------------------------------------
#  Was claude-haiku-4-5 direct from Anthropic. Moved off it on cost: DeepSeek
#  V4 Flash is roughly a tenth the price per token, and the bots chat
#  continuously, so that is the whole bill rather than a rounding error.
#
#  The model slug below is PINNED to a frozen dated snapshot, so it gets the
#  same discipline as the core and every module. The floating alias
#  `deepseek/deepseek-v4-flash` resolves to whichever dated build DeepSeek
#  currently points it at and can be repointed without telling us -- the
#  property of an unpinned image tag, which this repo refuses everywhere else.
#  Unpinned was tolerable only because a bad model shows up in the request log
#  as bad dialogue; pinning means it cannot change under us at all.
#
#  The pin costs about 2% more per token ($0.09 / $0.18 per M in/out, against
#  $0.0882 / $0.1764 for the alias) -- immaterial next to reproducible bot
#  dialogue. Moving to the floating alias, if you ever want newer builds
#  automatically, is one line plus a bridge restart:
#
#      LLMChatter.Model = deepseek/deepseek-v4-flash
#
#  Going BACK to Haiku is two lines here plus `docker restart
#  ac-llm-chatter-bridge` -- no rebuild, provided ANTHROPIC_API_KEY is still
#  set in Dokploy (leave it set; that is the whole point of keeping it):
#
#      LLMChatter.Provider = anthropic
#      LLMChatter.Model    = claude-haiku-4-5-20251001
#
#  Moving to local inference later is the same shape of change:
#
#      LLMChatter.Provider = ollama
#      LLMChatter.Model    = qwen3:4b
#      LLMChatter.Ollama.BaseUrl = http://<host>:11434
#
#  Note the local target is a 4B model, not a 1B one. Upstream warns that
#  smaller models "frequently produce malformed JSON", and the bridge depends
#  on structured output -- a model that rambles fails outright rather than
#  just sounding worse.
#
#  The bridge image's entrypoint reads the Provider set below and injects only
#  that provider's API key. Set it to `openai` or `google` and the container
#  refuses to start rather than shipping upstream's placeholder key and
#  401-ing on every bot line. OpenRouter.BaseUrl is left at the upstream
#  default; HttpReferer and Title are attribution-only and stay empty.

LLMChatter.Enable   = 1
LLMChatter.Provider = openrouter
LLMChatter.Model    = deepseek/deepseek-v4-flash-0731


# -----------------------------------------------------------------------------
#  REASONING -- off, because bot chatter has nothing to think about
# -----------------------------------------------------------------------------
#  This key is NOT upstream. Upstream sends OpenRouter exactly model, max
#  tokens, temperature and messages, with no way to pass a `reasoning` object;
#  the bridge image adds one -- see docker/llm-chatter-bridge.Dockerfile. So
#  this is one of the few keys here that a bridge rebuild, not just a restart,
#  had to pay for once. Changing its VALUE is a restart like everything else.
#
#  It matters on the hybrid DeepSeek slugs (V3.2, V4), where a single model ID
#  serves both modes and reasoning tokens are billed as output. A bot says one
#  or two sentences in character; there is no problem in that worth a thinking
#  budget, and it is the same cost argument that moved us off Haiku in the
#  first place. Reasoning also risks leaking <think> text into the structured
#  output the bridge parses.
#
#  Accepted values:
#      off / 0 / false / none   ->  {"reasoning": {"enabled": false}}
#      on  / 1 / true           ->  {"reasoning": {"enabled": true}}
#      minimal|low|medium|high|xhigh|max  ->  {"reasoning": {"effort": ...}}
#      empty                    ->  parameter omitted, model's own default
#
#  Anything else is ignored with a warning in the bridge log, so check
#  `docker logs ac-llm-chatter-bridge` after editing rather than assuming.
#
#  This key is LIVE with the model set above -- OpenRouter lists `reasoning`
#  among the supported parameters for deepseek-v4-flash-0731, so `off` really
#  is suppressing thinking rather than being quietly ignored. On a slug that
#  cannot reason (the previous qwen3-235b-a22b-2507, for one) OpenRouter drops
#  the parameter instead of erroring, so it is safe to leave set across model
#  changes in either direction.
#
#  OpenRouter-only. The Ollama equivalent is LLMChatter.Ollama.DisableThinking
#  (already 1 upstream) and the Gemini one is LLMChatter.Google.ThinkingBudget;
#  neither is affected by this key.

LLMChatter.OpenRouter.Reasoning = off


# -----------------------------------------------------------------------------
#  SPANISH
# -----------------------------------------------------------------------------
#  ES is natively supported -- the bridge injects a language instruction into
#  every prompt. The prompt templates themselves stay in English on purpose:
#  they are instructions to the model, not output, and translating them tends
#  to make results worse.
#
#  WoW proper nouns are Spanish here, which is NOT upstream behaviour. The
#  module hard-codes "keep proper nouns in English" into get_language_rule()
#  in tools/chatter_shared.py and offers no config, data-file, plugin or
#  endpoint override for it, so the bridge image rewrites that clause at build
#  time -- see docker/llm-chatter-bridge.Dockerfile.
#
#  The reason: the kids play on esES clients, which render the zone as
#  "Ventormenta". A bot saying "Stormwind" was a seam with no upside. Now both
#  agree. Player, bot and guild names are still never translated, and the model
#  is told to keep the English name when it is unsure of the official Spanish
#  one -- a wrong invented name is worse than an English one.
#
#  This does NOT touch server data. Data files stay enUS because playerbots
#  matches spell logic on English spell names; only the text a bot speaks
#  changes. Everything Blizzard-authored (quests, items, NPC dialogue) was
#  already Spanish for an esES client -- it comes from the client's own files
#  and the world DB *_locale tables, not from this module. See DBC.Locale in
#  family-settings.ini.
#
#  Changing this back means rebuilding the bridge image, not editing a key.

LLMChatter.Language = ES

#  Upstream notes Spanish tokenizes larger than English and suggests ~80-100
#  per line. The default of 120 already covers that, so it is left alone.


# -----------------------------------------------------------------------------
#  TONE -- lower than upstream, on purpose
# -----------------------------------------------------------------------------
#  Upstream default is 0.8, tuned for adult players who want authenticity.
#  0.4 keeps bots in character with far less improvisation. This is the single
#  most effective safety dial short of changing models, because unlike the
#  playerbots text table there is no fixed corpus to audit -- see the note in
#  family-settings.ini.

LLMChatter.Temperature = 0.4


# -----------------------------------------------------------------------------
#  AUDIT LOG -- treat this as mandatory, not optional
# -----------------------------------------------------------------------------
#  Every prompt and every response is written as one JSON line. This is the
#  only way to know what the bots actually said to your kids, and it is what
#  makes an LLM acceptable here at all. Read it for the first week.
#
#      docker exec ac-llm-chatter-bridge tail -f /logs/llm_requests.jsonl
#
#  It is NOT a content filter. Neither this module nor mod-ollama-chat has
#  one. It is after-the-fact review.
#
#  This log carries MORE weight since the move off Claude, not less. Part of
#  what made an unfiltered LLM acceptable here was Anthropic's alignment doing
#  work no setting in this file can do. DeepSeek V4 Flash is a different model
#  with a different profile and the module still filters nothing, so read the
#  log for a week after the cutover exactly the way it was read on the first
#  deploy -- do not assume the earlier week of clean logs still applies.

LLMChatter.RequestLog.Enable    = 1
LLMChatter.RequestLog.Path      = /logs/llm_requests.jsonl
LLMChatter.RequestLog.MaxSizeMB = 50


# -----------------------------------------------------------------------------
#  DATABASE -- the bridge talks to MySQL directly
# -----------------------------------------------------------------------------
#  It reads queued events and writes replies back; the worldserver never waits
#  on an API call. Host is the compose service name, not localhost.
#  Database.Password is injected at container start, not stored here.

LLMChatter.Database.Host = ac-database
LLMChatter.Database.Port = 3306
LLMChatter.Database.User = root
LLMChatter.Database.Name = acore_characters
