# =============================================================================
#  Family server settings -- EDIT THIS FILE, not family.env
# =============================================================================
#  These are real AzerothCore / mod-playerbots config keys, spelled exactly as
#  they appear in worldserver.conf.dist and playerbots.conf.dist.
#
#  After changing anything here, regenerate the env file:
#      python3 scripts/ini2env.py family-settings.ini > family.env
#
#  Then redeploy in Dokploy. No rebuild needed -- these are runtime settings.
# =============================================================================


# -----------------------------------------------------------------------------
#  REALM BASICS
# -----------------------------------------------------------------------------

# 0 = NORMAL (PvE). No open-world PvP, no ganking, nobody can attack the kids.
# 1 = PvP, 4 = RP, 6 = RP-PvP. Leave this at 0.
GameType = 0

RealmZone = 1

Motd = Bienvenidos a Azeroth! Escribe .help para ver los comandos.

# 255 = auto-detect from the client. The server data files are enUS (required
# by playerbots, its spell logic matches on English spell names), but the
# client still renders everything it owns in Spanish. Leave at 255.
DBC.Locale = 255

# Home server: roughly (CPU cores - 2). Do not go above 8, it makes things
# worse, not better. AzerothCore is bound by single-core speed.
MapUpdate.Threads = 4

# Anti-cheat that kicks clients it does not recognise. Useless on a private
# family realm and a common cause of mystery disconnects when using addons.
Warden.Enabled = 0

CloseIdleConnections = 0

# Print helpful "you are connected to..." info on login.
Server.LoginInfo = 1


# -----------------------------------------------------------------------------
#  GENTLE PROGRESSION -- short sessions should still feel rewarding
# -----------------------------------------------------------------------------
#  x3 is the sweet spot for kids: fast enough that a 45-minute session shows
#  visible progress, slow enough that zones and quests still make sense.
#  Bump to 5-7 if levelling still feels like homework. Above ~10 you outlevel
#  the quest chains and the world stops making narrative sense.

Rate.XP.Kill      = 3
Rate.XP.Quest     = 3
Rate.XP.Quest.DF  = 3
Rate.XP.Explore   = 3
Rate.XP.Pet       = 3

Rate.Drop.Money   = 3

Rate.Rest.InGame  = 3
Rate.Rest.Offline.InTavernOrCity = 3

Rate.Reputation.Gain = 2

# Loot drop rates. x2 on the good stuff means more "look what I got!" moments
# without flooding bags with grey vendor trash.
Rate.Drop.Item.Uncommon  = 2
Rate.Drop.Item.Rare      = 2
Rate.Drop.Item.Epic      = 2


# -----------------------------------------------------------------------------
#  NO PUNISHMENT ON DEATH -- the single biggest source of kid frustration
# -----------------------------------------------------------------------------

# Resurrection sickness applies from this level upward. Max level is 80, so
# 100 means it never happens.
Death.SicknessLevel = 100

# Seconds you must wait before you can reclaim your corpse. 0 = instantly.
Death.CorpseReclaimDelay.PvE = 0
Death.CorpseReclaimDelay.PvP = 0

# Broken gear that costs gold to repair, after a death that was already sad.
DurabilityLoss.OnDeath = 0
DurabilityLoss.OnSpiritResurrect = 0
DurabilityLoss.InPvP = 0
DurabilityLossChance.Damage = 0
DurabilityLossChance.Absorb = 0
DurabilityLossChance.Parry  = 0
DurabilityLossChance.Block  = 0

# No fall damage. Kids jump off things. Constantly.
Rate.Damage.Fall = 0

# 0 = everyone breathes underwater forever. Drowning while exploring a lake is
# a classic small-child meltdown.
DisableWaterBreath = 0


# -----------------------------------------------------------------------------
#  LESS TEDIUM
# -----------------------------------------------------------------------------

# Every flight point known from character creation, both factions.
AllFlightPaths = 1

# 2 = instant flights, but each flight master lets you toggle the scenic route
# back on. Best of both: no 6-minute silent flight, but the option remains.
InstantFlightPaths = 2

# Lets a small family group complete quests flagged as raid content.
Quests.IgnoreRaid = 1

# Keeps your bot group together when someone logs out for dinner.
LeaveGroupOnLogout.Enabled = 0


# =============================================================================
#  PLAYERBOTS
# =============================================================================

AiPlayerbot.Enabled = 1

# How many "other players" wander the world. The module default is 500.
#
# 150 is a middle setting: cities and questing zones feel populated without the
# host working hard. For reference, Dad's MMO Lab ships 1600-2000 on a 16 GB
# Steam Deck, so this is still conservative -- the module scales much further
# than it first appears.
#
# This is the first dial to turn if the server struggles. It is a runtime
# setting: regenerate family.env and redeploy, no rebuild.
AiPlayerbot.MinRandomBots = 150
AiPlayerbot.MaxRandomBots = 150

# 0 = work out how many bot accounts are needed from MaxRandomBots. Leave it.
AiPlayerbot.RandomBotAccountCount = 0

AiPlayerbot.RandomBotAutologin = 1

# Bots only wake up when a real person is online. On a family server that is
# most of the day, so this saves a lot of CPU and electricity.
AiPlayerbot.DisabledWithoutRealPlayer = 1
AiPlayerbot.DisabledWithoutRealPlayerLoginDelay = 15
AiPlayerbot.DisabledWithoutRealPlayerLogoutDelay = 120

# Max bots one player can have in their own party. 4 gives a full 5-man group,
# which is what you want for dungeons. The module default of 40 lets a kid
# summon a 40-bot raid, which is funny once and then unplayable.
AiPlayerbot.MaxAddedBots = 4

# Random bots stay in this level band.
AiPlayerbot.RandomBotMinLevel = 1
AiPlayerbot.RandomBotMaxLevel = 80

# No bot battlegrounds -- this is a PvE realm.
AiPlayerbot.RandomBotJoinBG = 0

# Bots can still queue for dungeons together.
AiPlayerbot.RandomBotJoinLfg = 1

# Bots do not announce group/guild invites in chat. Less noise.
AiPlayerbot.InviteChat = 0

# Bots teleport to you when you invite them, instead of running across the map.
AiPlayerbot.SummonWhenGroup = 1

# 0 = disabled, 1 = GM only, 2 = all players, 3 = auto on login.
# 2 lets a kid hand over their own character to the AI when they get stuck on
# a hard pull, which is a great "unstick me" button.
AiPlayerbot.SelfBotLevel = 2


# -----------------------------------------------------------------------------
#  BOT CHAT -- THE ACTUAL KID-SAFETY SETTINGS
# -----------------------------------------------------------------------------
#  The closed realm keeps strangers out. It does NOT control what the bots
#  themselves say, and the module ships a chat line set aimed at public
#  servers. Everything below is set explicitly rather than inherited, because
#  these are the only values in this file where the wrong default is a problem
#  rather than an inconvenience.
#
#  The offending lines all live under one text key, 'suggest_something_toxic',
#  in modules/mod-playerbots/data/sql/playerbots/. They are crude sexual jokes
#  ("I EAT ASS", "ERP?", "deez nutz in ur mouth"). The rows are installed in
#  the database no matter what -- these settings decide whether a bot can ever
#  pick one. Do not assume they are off because you have not seen them.

# The gate on that text key. Upstream default is already 0, and its own comment
# reads "Bots will say very rude things". Pinned here so an upstream change
# cannot quietly turn it on during an update.
AiPlayerbot.BroadcastChanceSuggestSomethingToxic = 0

# Same idea for the "toxic links" set. Also 0 upstream. Also pinned.
AiPlayerbot.BroadcastChanceSuggestToxicLinks = 0

# These two are the real fix -- they are ON upstream (30 and 40) and, unlike
# the broadcasts above, a player triggers them rather than the bot deciding on
# its own. See modules/mod-playerbots/src/Bot/PlayerbotAI.cpp:1242-1251: a bot
# replies when someone posts a message starting with ToxicLinksPrefix
# (default "gnomes") containing an item or quest link, or links Thunderfury
# (item 19019). A kid experimenting with chat links can set this off.
AiPlayerbot.ToxicLinksRepliesChance = 0
AiPlayerbot.ThunderfuryRepliesChance = 0

# Bots spontaneously spamming the Thunderfury copypasta. Upstream default is 1.
AiPlayerbot.BroadcastChanceSuggestThunderfury = 0

#  Note: AIPlayerbot.GuildFeedback appears in playerbots.conf.dist but nothing
#  in the module source ever reads it. Setting it has no effect.


# -----------------------------------------------------------------------------
#  HAND CHAT OVER TO mod-llm-chatter
# -----------------------------------------------------------------------------
#  The bots now hold real conversations in Spanish through an LLM instead of
#  drawing from playerbots' fixed English phrase table. mod-llm-chatter
#  requires its predecessor to be switched off, otherwise both systems talk at
#  once and bots contradict themselves mid-sentence.
#
#  This is upstream's own required list (README, "Configure"), minus
#  GuildFeedback, which is the dead key noted above.
#
#  Turning RandomBotTalk off also means the crude phrase table can no longer be
#  reached through random chatter at all. Keep the pins above anyway: the
#  toxic REPLY paths live in PlayerbotAI.cpp and are a separate mechanism that
#  this does not cover.
#
#  Tone and language for the replacement live in llm-chatter-settings.conf, not
#  here -- that file is read by both the worldserver and the bridge.

AiPlayerbot.RandomBotTalk = 0
AiPlayerbot.EnableBroadcasts = 0
AiPlayerbot.RandomBotEmote = 0
AiPlayerbot.RandomBotSuggestDungeons = 0
AiPlayerbot.EnableGreet = 0
AiPlayerbot.RandomBotSayWithoutMaster = 0

#  Left ON -- it is behaviour, not chat, and the LLM does not replace it:
#    AiPlayerbot.EnableRandomBotTrading = 1
